services:

  - type: web
    name: aegisrx-care-drift-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: GEMINI_API_KEY
        sync: false

      - key: ALLOWED_ORIGIN
        sync: false

  - type: web
    name: aegisrx-care-drift-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        sync: false
